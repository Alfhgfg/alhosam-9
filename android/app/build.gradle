apply plugin: 'com.android.application'

import groovy.json.JsonSlurper

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def googleServicesFile = file('google-services.json')
def hasGoogleServicesJson = googleServicesFile.exists() && googleServicesFile.length() > 0
def googleServicesPackageMatched = false
def hasAndroidOAuthInGoogleServices = false
def hasWebOAuthInGoogleServices = false

if (hasGoogleServicesJson) {
    try {
        def gsJson = new JsonSlurper().parse(googleServicesFile)
        def matchedClient = gsJson?.client?.find { c ->
            c?.client_info?.android_client_info?.package_name == "com.alhussam.grocery"
        }
        googleServicesPackageMatched = (matchedClient != null)
        if (matchedClient?.oauth_client) {
            hasAndroidOAuthInGoogleServices = matchedClient.oauth_client.any { o -> o?.client_type == 1 }
            hasWebOAuthInGoogleServices = matchedClient.oauth_client.any { o -> o?.client_type == 3 && o?.client_id }
        }
    } catch (Exception ex) {
        logger.warn("WARNING: Failed to parse android/app/google-services.json: ${ex.message}")
        hasGoogleServicesJson = false
    }
}

android {
    namespace = "com.alhussam.grocery"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.alhussam.grocery"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "71.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        if (!hasWebOAuthInGoogleServices) {
            resValue "string", "default_web_client_id", "721494882410-v77p8bf1j61p7gcs9oraaj68iq44prc7.apps.googleusercontent.com"
        }
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        debug {
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
        release {
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

if (hasGoogleServicesJson && googleServicesPackageMatched) {
    apply plugin: 'com.google.gms.google-services'
    if (!hasAndroidOAuthInGoogleServices) {
        logger.warn("WARNING: android/app/google-services.json is missing Android OAuth client (client_type: 1). Register SHA-1 & SHA-256 in Firebase Console and re-download google-services.json.")
    }
} else {
    logger.warn("WARNING: Valid android/app/google-services.json for com.alhussam.grocery not found; google-services plugin not applied.")
}
